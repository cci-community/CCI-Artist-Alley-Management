<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCI Artist Alley — Management Dashboard</title>
    <meta name="description" content="Comic Con India Artist Alley Management System">
    <meta name="theme-color" content="#0a0a1a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-inner">
            <div class="header-brand">
                <div>
                    <h1 class="brand-title">CCI Artist Alley</h1>
                    <p class="brand-sub">Management Dashboard</p>
                </div>
            </div>
            <div class="header-actions">
                <span class="last-updated" id="lastUpdated"></span>
                <button class="btn-refresh" id="refreshBtn" onclick="loadData()">
                    <span class="refresh-icon">↻</span>
                    <span>Refresh</span>
                </button>
            </div>
        </div>
    </header>

    <!-- ===== STATS BAR ===== -->
    <div class="stats-section">
        <div class="stats-grid stats-grid-3">
            <div class="stat-card clickable" id="btn-shows" onclick="setMainView('shows')">
                <div class="stat-icon">🎪</div>
                <div class="stat-info">
                    <div class="stat-value" id="statTotalShows">14</div>
                    <div class="stat-label">TOTAL SHOWS</div>
                </div>
            </div>
            <div class="stat-card clickable active" id="btn-database" onclick="setMainView('database')">
                <div class="stat-icon">🎭</div>
                <div class="stat-info">
                    <div class="stat-value" id="statTotalArtists">—</div>
                    <div class="stat-label">ARTISTS DATABASE</div>
                </div>
            </div>
            <div class="stat-card clickable" id="btn-onboarded" onclick="setMainView('onboarded')">
                <div class="stat-icon">📝</div>
                <div class="stat-info">
                    <div class="stat-value" id="statArtistsOnboarded">—</div>
                    <div class="stat-label">ARTIST ONBOARDED</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== MAIN ===== -->
    <main class="main">
        <!-- Tab Navigation (Optional, kept for consistency with screenshot) -->
        <nav class="tab-nav" id="tabNav">
            <button class="tab active" data-tab="artists" id="tab-btn-artists" onclick="setMainView('database')">🎨 Artists</button>
            <button class="tab" data-tab="overview" id="tab-btn-overview" onclick="setMainView('shows')">📊 Show Overview</button>
        </nav>

        <!-- ===== ARTISTS DATABASE / ONBOARDED VIEW ===== -->
        <section class="tab-content active" id="view-artists">
            <div class="filters">
                <div class="search-wrap">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search artists, POC, email, city..." class="search-input" autocomplete="off">
                    <button class="search-clear" id="searchClear" onclick="clearSearch()" style="display:none">✕</button>
                </div>
                <!-- We can add filters here if needed -->
            </div>
            
            <div class="results-bar">
                <span class="results-count" id="resultsCount">Loading...</span>
            </div>

            <!-- Grid View for Database -->
            <div class="artists-grid" id="artistsGrid"></div>
        </section>

        <!-- ===== SHOW-WISE TABULAR VIEW ===== -->
        <section class="tab-content" id="view-shows">
            <div class="filters">
                <select id="showSelect" class="filter-select" onchange="renderShowTable()">
                    <option value="">Select a Show...</option>
                    <!-- Populated via JS -->
                </select>
            </div>
            
            <div class="table-wrap" id="showTableContainer">
                <table class="data-table" id="showDataTable">
                    <thead>
                        <tr>
                            <th class="sortable">Brand Name</th>
                            <th class="sortable">POC</th>
                            <th class="sortable">Consent Sent</th>
                            <th class="sortable">GST Received</th>
                            <th class="sortable">Book Launch</th>
                            <th class="sortable">Stage Activity</th>
                        </tr>
                    </thead>
                    <tbody id="showTableBody">
                        <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Please select a show to view artists.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="errorToast"></div>

    <!-- ===== LOADING ===== -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <!-- ===== MODAL OVERLAY ===== -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal-panel" id="modalPanel" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-content-wrap" id="modalContent">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
